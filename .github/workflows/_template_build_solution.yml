name: _Build Solution
    
on:
  workflow_call:
    inputs:
      environments:
          required: true
          type: string
          description: 'A commaseperated list of environments to build for. E.g., "dev,tst,prd"'
      build_parameter_file:
          type: boolean
          default: true
        
jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: 1
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
      VSO_FORCE_UTF8_OUTPUT: true
      TENANT_ID: ${{ secrets.SPN_TENANT_ID }}
      CLIENT_ID: ${{ secrets.SPN_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.SPN_CLIENT_SECRET }}

    steps: 
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r automation/resources/requirements.txt

      # The parameter file is no longer built here. `fabricops release` renders whatever it
      # has to resolve at deploy time into automation/resources/parameters/generated/, and
      # the committed parameter.yml is never rewritten (documentation/specs/E09 section 3).
      # The old script upserted into the committed file and copied it into every layer
      # folder; running it now would fight the overlay.

      # A SQL Database in Fabric is not deployed as a Fabric item - its schema goes in as a
      # dacpac - so these steps only make sense when the solution actually has a .sqlproj.
      # Gated so that a solution without one needs no dotnet SDK at all.
      - uses: actions/setup-dotnet@v4
        if: hashFiles('solution/**/*.sqlproj') != ''
        with:
          dotnet-version: '8.0.x'

      - name: 'Build Metadata .dacpac'
        if: hashFiles('solution/**/*.sqlproj') != ''
        run: dotnet build 'solution/engineering/core/Metadata.SQLDatabase/Metadata.sqlproj' /p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlDbFabricDatabaseSchemaProvider

      - name: Upload Solution artifacts
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: solution
          path: ./solution

      - name: Upload Automation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: automation
          path: |
            ./automation/**