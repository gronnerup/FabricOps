parameters:
  - name: environments
    type: string
    default: 'tst,prd'
  - name: build_parameter_file
    type: boolean
    default: true

jobs:
- job: build_solution
  displayName: 'Build Fabric Solution'
  pool:
    vmImage: 'windows-latest'

  variables:
  - name: PYTHONIOENCODING
    value: utf-8
  - name: PYTHONUNBUFFERED
    value: 1
  - name: DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION
    value: true
  - name: VSO_FORCE_UTF8_OUTPUT
    value: true
  - group: Fabric_Automation

  steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - script: |
        python -m pip install --upgrade pip
        pip install -r automation/resources/requirements.txt
      displayName: 'Install Python dependencies'

    # The parameter file is no longer built here. `fabricops release` renders whatever it
    # has to resolve at deploy time into automation/resources/parameters/generated/, and
    # the committed parameter.yml is never rewritten (documentation/specs/E09 section 3).
    # The old script upserted into the committed file and copied it into every layer
    # folder; running it now would fight the overlay.

    - task: PowerShell@2
      displayName: 'Download Tabular Editor'
      inputs:
        targetType: 'inline'
        script: |
          $tePath = "$(Build.SourcesDirectory)\_tools\TabularEditor"
          New-Item -ItemType Directory -Path $tePath -Force | Out-Null
          
          Write-Host "Downloading Tabular Editor binaries..."
          $downloadUrl = "https://github.com/TabularEditor/TabularEditor/releases/latest/download/TabularEditor.Portable.zip"
          $zipFile = "$tePath\TabularEditor.zip"
          
          Invoke-WebRequest -Uri $downloadUrl -OutFile $zipFile
          Expand-Archive -Path $zipFile -DestinationPath $tePath -Force
          
          Write-Host "Tabular Editor downloaded successfully"
      
    - script: python -u automation/scripts/utils_build_semantic_models.py --model_dir "$(Build.SourcesDirectory)\solution\model" --tabulareditor_dir "$(Build.SourcesDirectory)\_tools\TabularEditor"
      displayName: 'Build semantic models (Fabric TMDL output)'

    # ADO conditions cannot test the filesystem, so a step has to answer the question first.
    - powershell: |
        $found = @(Get-ChildItem -Path "$(Build.SourcesDirectory)/solution" -Recurse -Filter *.sqlproj).Count -gt 0
        Write-Host "##vso[task.setvariable variable=hasSqlProject]$($found.ToString().ToLower())"
        Write-Host "SQL projects present: $found"
      displayName: 'Detect SQL projects'

    - task: UseDotNet@2
      condition: and(succeeded(), eq(variables['hasSqlProject'], 'true'))
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - script: dotnet build "solution/engineering/core/Metadata.SQLDatabase/Metadata.sqlproj" /p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlDbFabricDatabaseSchemaProvider
      displayName: 'Build Metadata .dacpac'
      condition: and(succeeded(), eq(variables['hasSqlProject'], 'true'))

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'solution'
        ArtifactName: 'solution'
        publishLocation: 'Container'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: 'automation'
        ArtifactName: 'automation'
        publishLocation: 'Container'