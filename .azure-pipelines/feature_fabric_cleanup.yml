pr: none

# A full sync every night, whatever changed: the merge-time sync only checks the layers
# whose folder the merge touched, and a layer can need a sync without its folder
# changing (a deferred report whose model has since arrived). This closes that gap.
schedules:
  - cron: '0 3 * * *'
    displayName: Nightly full dev sync
    branches:
      include: [main]
    always: true

trigger: 
  branches:
    include:
    - main

# A merge to main is the normal trigger, but it gives you no say over which copy of the
# scripts runs - which makes it a poor way to test a teardown, and means a cleanup that
# failed can only be retried by merging something else. Queue the pipeline manually and
# supply the branch instead.
parameters:
  - name: log_level
    displayName: 'Log level (debug prints every fab command; trace adds API responses)'
    type: string
    default: 'info'
    values: [ 'info', 'debug', 'trace' ]
  - name: branch_name
    displayName: 'Feature branch to clean up (manual runs only)'
    type: string
    default: ''

jobs:
- job: cleanup_feature
  condition: and(succeeded(), in(variables['Build.Reason'], 'IndividualCI', 'Manual', 'Schedule'))
  displayName: 'Cleanup feature workspaces, then sync dev with main'
  pool:
    vmImage: 'ubuntu-latest'

  variables:
  - name: PYTHONIOENCODING
    value: utf-8
  - name: PYTHONUNBUFFERED
    value: 1
  - name: DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION
    value: true
  - name: VSO_FORCE_UTF8_OUTPUT
    value: true
  - name: PIP_CACHE_DIR
    value: $(Pipeline.Workspace)/.pip
  - group: Fabric_Automation

  steps:
    # Full history, so the merge-time sync can diff the merge against its parent.
    - checkout: self
      fetchDepth: 0

    # A manual run says which branch it means; a merge has to be traced back to its PR.
    - bash: echo "##vso[task.setvariable variable=SourceRefName]${{ parameters.branch_name }}"
      displayName: 'Use the branch supplied by hand'
      condition: ne('${{ parameters.branch_name }}', '')

    - task: Bash@3
      displayName: 'Get sourceRefName from pullrequestquery endpoint'
      condition: eq('${{ parameters.branch_name }}', '')
      inputs:
        targetType: 'inline'
        script: |
          echo "##[group]Get PR sourceRefName from commit ID using pullrequestquery"

          ORG_URL="${SYSTEM_COLLECTIONURI}"
          PROJECT="${SYSTEM_TEAMPROJECT}"
          REPO_NAME="${BUILD_REPOSITORY_NAME}"
          COMMIT_ID="${BUILD_SOURCEVERSION}"

          echo "Looking for PR with lastMergeCommit: $COMMIT_ID"

          API_URL="${ORG_URL}${PROJECT}/_apis/git/repositories/${REPO_NAME}/pullrequestquery?api-version=7.0"
          JSON_BODY=$(jq -n --arg commit "$COMMIT_ID" '{ queries: [ { items: [$commit], type: "lastMergeCommit" } ] }')

          RESPONSE=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $SYSTEM_ACCESSTOKEN" \
            -d "$JSON_BODY" \
            "$API_URL")

          # Extract the sourceRefName from the results
          SOURCE_REF=$(echo "$RESPONSE" | jq -r --arg commit "$COMMIT_ID" '.results[0][$commit][0].sourceRefName')

          if [ "$SOURCE_REF" == "null" ] || [ -z "$SOURCE_REF" ]; then
            echo "No sourceRefName found for commit $COMMIT_ID"
          else
            echo "Found sourceRefName: $SOURCE_REF"
            echo "##vso[task.setvariable variable=SourceRefName]$SOURCE_REF"
          fi

          echo "##[endgroup]"
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.12'

    - task: Cache@2
      displayName: 'Cache pip'
      inputs:
        key: 'pip | "$(Agent.OS)" | automation/resources/requirements.txt'
        restoreKeys: |
          pip | "$(Agent.OS)"
        path: $(PIP_CACHE_DIR)

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: 'Install Python dependencies'
      workingDirectory: '$(Build.SourcesDirectory)/automation/resources'

    - script: python -u automation/scripts/fabric_feature_maintainance.py --action delete --branch_name $(SourceRefName)
      displayName: 'Run Fabric feature maintenance script'
      condition: and(succeeded(), ne(variables['SourceRefName'], ''))
      env:
        TENANT_ID: $(SPN_TENANT_ID)
        CLIENT_ID: $(SPN_CLIENT_ID)
        CLIENT_SECRET: $(SPN_CLIENT_SECRET)
        FABOPS_LOG_LEVEL: ${{ parameters.log_level }}

    # Fabric never pulls on its own, so main moving forward leaves dev behind until something
    # asks it to catch up. Unconditional: this is about main having changed, not about a PR
    # having closed, so a direct push to main syncs dev too.
    - bash: |
        args=""
        # A merge names its changes; a scheduled or manual run checks everything.
        if [ "$BUILD_REASON" = "IndividualCI" ]; then args="--changed_since HEAD~1"; fi
        python -u automation/scripts/fabric_gitsync_env.py --environment dev $args
      displayName: 'Synchronize dev workspaces with main'
      env:
        TENANT_ID: $(SPN_TENANT_ID)
        CLIENT_ID: $(SPN_CLIENT_ID)
        CLIENT_SECRET: $(SPN_CLIENT_SECRET)
        FABOPS_LOG_LEVEL: ${{ parameters.log_level }}
